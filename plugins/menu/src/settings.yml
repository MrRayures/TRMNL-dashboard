# Plugin settings, in TRMNL's private-plugin export format (settings.yml).
# Keep it in sync with the plugin on trmnl.com; the preview reads `name`
# (title bar instance name) and `framework_version` (framework CSS/JS loaded).
# Docs: https://help.trmnl.com/en/articles/10542599-importing-and-exporting-private-plugins
---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.4.7
# Our copy of every published Meridio menu, refreshed each Monday by
# .github/workflows/sync-data.yml; transform.js picks today (Europe/Paris).
polling_url: https://mrrayures.github.io/TRMNL-dashboard/menu.json
polling_headers: ''
name: Menu cantine
description: Menu de la cantine, du jour ou de la semaine
refresh_interval: 1440
custom_fields:
- keyname: display
  field_type: select
  name: Affichage
  description: Menu du jour, ou les jours servis de la semaine en colonnes.
  options:
  - 'Menu du jour: day'
  - 'Semaine: week'
  default: day
