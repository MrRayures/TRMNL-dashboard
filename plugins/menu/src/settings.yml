# Plugin settings, in TRMNL's private-plugin export format (settings.yml).
# Keep it in sync with the plugin on trmnl.com; the preview reads `name`
# (title bar instance name) and `framework_version` (framework CSS/JS loaded).
# Docs: https://help.trmnl.com/en/articles/10542599-importing-and-exporting-private-plugins
---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.4.7
# Both dates are required; a wide range returns every published day
# (~6 weeks, ~150 KB) and transform.js picks today in Europe/Paris.
polling_url: https://rncuqer6baza2pzhumplpf24da0enxcg.lambda-url.eu-west-3.on.aws/satellite/ivawb/menuDay?startDate=2020-01-01&endDate=2099-12-31
polling_headers: ''
name: Menu du jour
description: Menu de la cantine du jour
refresh_interval: 1440
